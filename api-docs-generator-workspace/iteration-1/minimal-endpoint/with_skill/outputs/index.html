<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 { border-bottom: 3px solid #0078d4; padding-bottom: 10px; }
        h2 { color: #0078d4; margin-top: 30px; }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
            background-color: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            font-weight: 600;
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .section-note {
            background-color: #e8f4f8;
            border-left: 4px solid #0078d4;
            padding: 10px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>Create Post API</h1>

    <h2>Endpoint</h2>
    <p><code>POST /posts</code></p>

    <h2>Description</h2>
    <p>Creates a new post in the system.</p>

    <h2>Success Response</h2>
    <table class="api-success-responses">
        <thead>
            <tr>
                <th>Status Code</th>
                <th>Response Body</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>201</td>
                <td><code>{ "id": "post_789", "title": "My First Post", "body": "This is the content.", "created_at": "2024-01-20T14:22:00Z" }</code></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
