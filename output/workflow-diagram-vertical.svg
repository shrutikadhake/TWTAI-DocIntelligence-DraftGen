<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="640" height="1160" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1c1e">Documentation Automation Pipeline</text>
  <text x="320" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Raw demo transcript to publication-ready HTML</text>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#6b7280">four skills, zero manual formatting</text>

  <!-- input artifact -->
  <rect x="170" y="100" width="300" height="34" rx="17" fill="#eef0fd"/>
  <text x="320" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4f46e5">Raw Transcript (.vtt)</text>
  <line x1="320" y1="134" x2="320" y2="164" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 1 -->
  <g>
    <rect x="60" y="166" width="520" height="188" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="98" cy="202" r="16" fill="#4f46e5"/>
    <text x="98" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="124" y="199" font-size="16" font-weight="700" fill="#1c1c1e">transcript-normalizer-custom</text>
    <text x="90" y="238" font-size="13" fill="#1c1c1e">Strips timestamps, filler words, false starts, and</text>
    <text x="90" y="258" font-size="13" fill="#1c1c1e">side conversations from the raw VTT transcript</text>
    <rect x="90" y="288" width="460" height="30" rx="15" fill="#eef0fd"/>
    <text x="320" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Output: Structured JSON (goals, prereqs, tasks)</text>
  </g>

  <line x1="320" y1="354" x2="320" y2="384" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <g>
    <rect x="60" y="386" width="520" height="188" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="98" cy="422" r="16" fill="#4f46e5"/>
    <text x="98" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="124" y="419" font-size="16" font-weight="700" fill="#1c1c1e">documentation-author-custom</text>
    <text x="90" y="458" font-size="13" fill="#1c1c1e">Writes a task-oriented Markdown guide: intro,</text>
    <text x="90" y="478" font-size="13" fill="#1c1c1e">prerequisites, numbered steps, expected outcomes</text>
    <rect x="90" y="508" width="460" height="30" rx="15" fill="#eef0fd"/>
    <text x="320" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Output: Draft Markdown guide</text>
  </g>

  <line x1="320" y1="574" x2="320" y2="604" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <g>
    <rect x="60" y="606" width="520" height="188" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="98" cy="642" r="16" fill="#4f46e5"/>
    <text x="98" y="647" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="124" y="639" font-size="16" font-weight="700" fill="#1c1c1e">documentation-reviewer-custom</text>
    <text x="90" y="678" font-size="13" fill="#1c1c1e">Scores the draft against 8 writing standards —</text>
    <text x="90" y="698" font-size="13" fill="#1c1c1e">clarity, accessibility, Microsoft style compliance</text>
    <rect x="90" y="728" width="460" height="30" rx="15" fill="#eef0fd"/>
    <text x="320" y="748" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Output: QA score 89.5 / 100, 0 critical issues</text>
  </g>

  <line x1="320" y1="794" x2="320" y2="824" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4 -->
  <g>
    <rect x="60" y="826" width="520" height="188" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="98" cy="862" r="16" fill="#4f46e5"/>
    <text x="98" y="867" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="124" y="859" font-size="16" font-weight="700" fill="#1c1c1e">documentation-finalizer-custom</text>
    <text x="90" y="898" font-size="13" fill="#1c1c1e">Renders the reviewed Markdown into a clean,</text>
    <text x="90" y="918" font-size="13" fill="#1c1c1e">single-column, publication-ready HTML page</text>
    <rect x="90" y="948" width="460" height="30" rx="15" fill="#eef0fd"/>
    <text x="320" y="968" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Output: Published HTML guide</text>
  </g>

  <!-- Final output artifact -->
  <line x1="320" y1="1014" x2="320" y2="1044" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="1048" width="400" height="46" rx="23" fill="#4f46e5"/>
  <text x="320" y="1077" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Publication-Ready HTML Guide</text>

  <!-- footer -->
  <text x="320" y="1130" text-anchor="middle" font-size="12" fill="#6b7280">Same pipeline, reusable for every future demo transcript</text>
</svg>
